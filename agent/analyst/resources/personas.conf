# =============================================================================
# Persona pool — data-driven definitions for the consensus decision pool.
#
# Each persona independently evaluates the drafted domain model (bounded
# contexts + aggregate roots) against its own priorities. The Consensus Engine
# then synthesizes their confidence scores into a Conflict Report.
#
# This file is the single source of truth for the pool: add, remove, or retune
# a persona here and the fan-out scales to match — no code change required
# (PersonaPoolConfig.load parses it into PersonaDefinition instances).
#
# Fields:
#   id              stable kebab-case identifier (used in logs + the matrix)
#   role            human-facing name shown in the dashboard
#   focus           one-line summary of what this persona optimizes for
#   temperature     sampling temperature for this persona's evaluation
#   weight          relative weight in the weighted-matrix consensus (>= 0)
#   boundedContexts contexts this persona has authority over; empty = all
#   systemPrompt    the persona's evaluation system prompt
# =============================================================================

personas = [
