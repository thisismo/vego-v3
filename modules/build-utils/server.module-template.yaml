apply:
  - ./common.module-template.yaml

dependencies:
  - bom: $libs.ktor.bom
  - $libs.koin.ktor
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.serialization.kotlinx
  - $ktor.serialization.kotlinx.json
  - $kotlin.rpc.krpc.ktor.server
  - $kotlin.rpc.krpc.serialization.json

settings:
  ktor:
    enabled: true
    applyBom: true
    version: $libs.ktor.version