[versions]
koin-bom = "4.2.1"
ktor-bom = "3.5.0"
oidc = "0.16.5"
kermit = "2.1.0"
logback = "1.5.18"
realm = "2.3.0"
sqldelight = "2.3.2"
coroutines = "1.11.0"
atomicfu = "0.33.0"
sqldelight-env = "0.7.3"
koog = "1.0.0"
koog-additions = "1.0.0-beta"

[libraries]
# Koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-test = { module = "io.insert-koin:koin-test" }

# Koin Compose
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-compose-navigation = { module = "io.insert-koin:koin-compose-navigation3" }
koin-ktor = { module = "io.insert-koin:koin-ktor" }

# Ktor
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor-bom" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-client-android = { module = "io.ktor:ktor-client-android" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging" }
ktor-client-call-id = { module = "io.ktor:ktor-client-call-id" }

# Client Oidc
oidc-appsupport = { module = "io.github.kalinjul.kotlin.multiplatform:oidc-appsupport", version.ref = "oidc" }
oidc-okhttp4 = { module = "io.github.kalinjul.kotlin.multiplatform:oidc-okhttp4", version.ref = "oidc" }
oidc-ktor = { module = "io.github.kalinjul.kotlin.multiplatform:oidc-ktor", version.ref = "oidc" }

# Kermit Logger
logging-kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# Logback (SLF4J provider for JVM server)
logging-logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# SQLDelight (Kotlin Multiplatform persistence)
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-compiler = { module = "app.cash.sqldelight:compiler-env", version.ref = "sqldelight" }
sqlite-dialect = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sqldelight-gradle-plugin = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "sqldelight" }
sqldelight-environment = { module = "app.cash.sql-psi:environment", version.ref = "sqldelight-env" }

# KotlinX
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines"}
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }

# Koog
koog = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-agents-features-acp = { module = "ai.koog:agents-features-acp", version.ref = "koog-additions"}
koog-agents-additions = { module = "ai.koog:koog-agents-additions", version.ref = "koog-additions" }
# Koog's built-in agent tools (file IO, shell) — published on the beta line. See docs.koog.ai/tools/built-in-tools.
koog-agents-ext = { module = "ai.koog:agents-ext", version.ref = "koog-additions" }